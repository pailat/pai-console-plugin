# Fictional example for a project called Acme. Every value is made up.
schema_version = 1

[project]
pai_org = "acme"
pai_project = "acme-app"
linear_team = "ACME"        # issues look like ACME-123
# base_branch = "release/1.2"  # optional: Stop zone diff fallback when the run recorded no start commit

# Where the distiller writes Pai Knowledge: an organization and exactly one of project or product.
[knowledge]
organization = "acme"
project = "acme-app"

# Optional per-stream override, picked by the launcher's --stream option or the queue name.
[knowledge.streams.main]
product = "acme-storefront"             # a stream may use a product instead; the organization is inherited

[gates]
unit = "make test"
lint = ["make lint", "make typecheck"]

# Red-release hotfix lane: active only while active_when FAILS on the release tip.
[gates.hotfix]
active_when = "make typecheck-all"                  # fails when the release tip is red
applies_to = "(?i)release-red|^hotfix:"             # searched in the PR title and in each label
pre_merge = ["make typecheck-all", "make test-touched", "make scan-repo", "make scan-secrets"]
post_merge = "make gate-full"                       # the full gate on the tip after the merge
revert_on_failure = true

[zones.frontend]
globs = ["apps/acme-app/**"]
owners = ["acme-app-owner"]

[zones.contracts]
globs = ["packages/contracts/**", "AGENTS.md"]
owners = ["acme-lead"]
root = true

# Which zones each role may write. A role not listed falls back to the zones that name the agent as an owner.
[role_zones]
implementer = ["frontend"]
lead = ["frontend", "contracts"]

[machines.acme-desktop]
host = "acme-desktop.example.com"
os = "linux"
max_agents = 4

[queues.main]
machine = "acme-desktop"
model = "sonnet"
limit = 3

[limits]
max_agents = 6

[rules]
agents_file = "AGENTS.md"
root_paths = ["packages/contracts/**"]
must = ["Write English in code, comments and docs."]
push_wrapper = "scripts/queue-push.sh"   # the only way an agent may push; hooks refuse every other form
never = ["Push to main directly.", "Contact owner@example.com about builds."]

[models]
implementer = "sonnet"
mechanical = "haiku"

# Headless runs reach the Pai MCP with a machine token. The file holds the owner-placed token (mode 0600, your user);
# nothing here, and nothing in git, ever holds the value. With mcp_url set, the launcher fails closed unless the server connects.
[pai]
token_file = "~/.config/pai-harness/token"   # the default; PAI_HARNESS_TOKEN_FILE overrides it
mcp_url = "https://mcp.acme.example.com/mcp"
