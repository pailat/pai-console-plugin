# Checks the upstream Herdr repository for a new release every day. When there is one, it runs tools/vendor_herdr.py (the only way
# skills/herdr changes), regenerates the Codex packages and opens a pull request for review. It never edits the skill by hand and
# never merges: a person reviews the pull request, bumps the plugin version, and merges it.
# Repository setting required: Settings > Actions > General > "Allow GitHub Actions to create and approve pull requests". Without it the
# pull request step fails the job with an error naming that setting; it never fails silently.
name: herdr-release-watch

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: herdr-release-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # actions/checkout v4.2.2, pinned by commit.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Vendor the newest upstream release and open a pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # 1. Prove the committed skill is exactly upstream at the pin: re-vendor with no flags and fail on any difference
          #    (a coordinated hand edit of the skill and its record would otherwise pass the offline checks).
          python3 tools/vendor_herdr.py
          if ! git diff --exit-code -- skills/herdr vendor/herdr || [ -n "$(git status --porcelain -- skills/herdr vendor/herdr)" ]; then
            echo "::error title=Vendored Herdr skill differs from upstream::skills/herdr or vendor/herdr no longer equals upstream at the pinned commit. Never edit them by hand: restore them with tools/vendor_herdr.py."
            exit 1
          fi
          # 2. Move to the newest upstream release, if there is one.
          python3 tools/vendor_herdr.py --latest
          if [ -z "$(git status --porcelain -- vendor skills/herdr)" ]; then
            echo "Herdr is already at the newest upstream release."
            exit 0
          fi
          tag=$(python3 -c 'import json; print(json.load(open("vendor/herdr/PIN.json"))["tag"])')
          branch="herdr-release-watch/${tag}"
          if [ -n "$(gh pr list --head "$branch" --state all --json number --jq '.[].number')" ]; then
            echo "A pull request for ${tag} already exists."
            exit 0
          fi
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            echo "::error title=Herdr vendoring branch exists without a pull request::The branch ${branch} is already pushed but has no pull request, which means an earlier run could not create it. A repository admin must enable Settings > Actions > General > 'Allow GitHub Actions to create and approve pull requests'; then delete the branch or open its pull request by hand."
            exit 1
          fi
          python3 tools/build_codex.py
          checks=passed
          make check > check.log 2>&1 || checks=failed
          if [ "$checks" = failed ]; then
            echo "::group::make check output (failed)"
            cat check.log
            echo "::endgroup::"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add -A vendor skills/herdr plugins/codex
          git commit -m "chore: vendor Herdr ${tag}"
          git push origin "$branch"
          body="Automated by the herdr-release-watch workflow: upstream Herdr released ${tag}. \`tools/vendor_herdr.py --latest\` re-vendored \`skills/herdr\` from the new commit and \`tools/build_codex.py\` regenerated the Codex packages. Nothing was edited by hand. \`make check\` ${checks} on this branch.

          Before merging: review the upstream diff of \`skills/herdr\`, bump the \`pai-console\` version in \`.claude-plugin/plugin.json\` and \`tools/build_codex.py\` so installed copies update, and run \`python3 tools/build_codex.py\`. This workflow never merges."
          draft=""; [ "$checks" = passed ] || draft="--draft"
          if ! gh pr create --base "${GITHUB_REF_NAME}" --head "$branch" --title "chore: vendor Herdr ${tag}" --body "$body" $draft; then
            echo "::error title=Could not open the Herdr vendoring pull request::The branch ${branch} was pushed but the pull request was not created. A repository admin must enable Settings > Actions > General > 'Allow GitHub Actions to create and approve pull requests'. Until then this job fails on every new Herdr release."
            exit 1
          fi
